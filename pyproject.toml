[project]
name = "canvas-execution-engine"
version = "0.1.0"
description = "The canvas execution engine for the dataspace."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "cryptography>=46.0.7",
    "docker>=7.1.0",
    "fastapi>=0.128.7",
    "kubernetes>=36.0.3",
    "networkx>=3.6.0",
    "psycopg[binary,pool]>=3.2.0",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.0",
    "python-multipart>=0.0.26",
    "requests>=2.33.0",
    "SQLAlchemy>=2.0.46",
    "uvicorn>=0.50.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.19.1",
    "ruff>=0.15.0",
    "types-networkx>=3.6.0",
    "types-requests>=2.33.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["cee*"]

[tool.uv]
exclude-newer = "2 days"

[tool.mypy]
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
files = ["src/cee"]
strict = true

[tool.ruff]
src = ["src/cee"]
target-version = "py314"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["cee"]

[tool.ruff.lint]
fixable = ["ALL"]
unfixable = []
select = ["ALL"]
ignore = [
  "B008",    # depends in argument defaults
  "D100",    # module docstring
  "D104",    # package docstring
  "D203",    # blank line before class
  "D212",    # multi line summary first line
  "E501",    # line length
  "S101",    # use of assert
  "TC",      # move into type-checking block
  "ANN401",  # dynamically typed expressions
  "BLE001",  # blind except catching
  "COM812",  # add trailing comma
]
